<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rent Manager 🏢</title>
<style>
  :root, [data-theme="dark"] {
    --bg: #141225;
    --bg2: #26223f;
    --panel: #1f1b35;
    --panel-2: #2a2448;
    --panel-border: #3a3360;
    --text: #ece9ff;
    --muted: #9b94c4;
    --accent: #ffcf5c;
    --coin: #ffcf5c;
    --good: #68e39b;
    --warn: #ff7a7a;
    --unit-empty: #2a2448;
    --unit-furnished: #334a63;
    --shadow: rgba(0,0,0,0.4);
  }
  [data-theme="light"] {
    --bg: #f1f0fb;
    --bg2: #e3e0f6;
    --panel: #ffffff;
    --panel-2: #f3f1fc;
    --panel-border: #d6d2ee;
    --text: #221d3d;
    --muted: #6a6490;
    --accent: #e0a200;
    --coin: #d99e00;
    --good: #1fa15e;
    --warn: #d84848;
    --unit-empty: #ece9f7;
    --unit-furnished: #cfe0f0;
    --shadow: rgba(110,110,160,0.22);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg2) 0%, var(--bg) 70%);
    color: var(--text);
    min-height: 100vh;
    padding: 1rem 0.8rem 3rem;
    text-align: center;
    transition: background 0.4s ease, color 0.4s ease;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 1.9rem; margin: 0.2rem 0 0; }
  .sub { color: var(--muted); margin: 0.2rem 0 1rem; font-size: 0.9rem; }

  .theme-toggle {
    position: fixed; top: 0.8rem; right: 0.8rem; z-index: 100;
    background: var(--panel); border: 1px solid var(--panel-border);
    color: var(--text); border-radius: 999px; padding: 0.45rem 0.8rem;
    font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 14px var(--shadow);
  }

  /* HUD */
  .hud { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 0.8rem; }
  .chip {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 999px; padding: 0.4rem 0.9rem; font-weight: bold; font-size: 0.95rem;
    display: flex; align-items: center; gap: 0.35rem;
  }
  .chip.bump { animation: bump 0.3s ease; }
  @keyframes bump { 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }

  /* Building */
  .building {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 16px; padding: 0.8rem; margin: 0 auto 1rem; max-width: 560px;
    box-shadow: 0 10px 30px var(--shadow);
  }
  .roof { height: 20px; background: linear-gradient(var(--accent), transparent); border-radius: 12px 12px 0 0; opacity: 0.5; margin-bottom: 0.5rem; }
  .floor { display: flex; gap: 0.6rem; margin-bottom: 0.6rem; }
  .floor-label { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 0.65rem; color: var(--muted); align-self: center; }
  .units { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; flex: 1; }

  .unit {
    position: relative; aspect-ratio: 1 / 0.82; border-radius: 12px;
    background: var(--unit-empty); border: 2px solid var(--panel-border);
    cursor: pointer; padding: 0.4rem; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 0.1rem;
    transition: transform 0.1s ease, background 0.3s ease, border-color 0.2s ease;
    overflow: hidden;
  }
  .unit:hover { transform: translateY(-2px); }
  .unit:active { transform: scale(0.96); }
  .unit.furnished { background: var(--unit-furnished); }
  .unit.occupied { border-color: var(--good); }
  .unit.locked { border-style: dashed; opacity: 0.6; }
  .unit .tenant { font-size: 1.7rem; line-height: 1; }
  .unit .deco { font-size: 0.95rem; letter-spacing: -1px; }
  .unit .label { font-size: 0.62rem; color: var(--muted); }
  .unit .stars { font-size: 0.62rem; color: var(--accent); }
  .unit.request::after {
    content: "❗"; position: absolute; top: 2px; right: 4px; font-size: 0.9rem;
    animation: wig 1s ease-in-out infinite;
  }
  @keyframes wig { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} }

  /* rent bubble */
  .rent-bubble {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    background: var(--coin); color: #241d44; font-weight: bold; font-size: 0.7rem;
    padding: 1px 7px; border-radius: 999px; animation: bob 1.1s ease-in-out infinite;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3); z-index: 5;
  }
  @keyframes bob { 0%,100%{transform:translateX(-50%) translateY(0);} 50%{transform:translateX(-50%) translateY(-4px);} }

  .mood { font-size: 0.6rem; }

  /* buttons */
  .btn-row { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-top: 0.5rem; }
  button.action {
    font-family: inherit; font-size: 0.9rem; border-radius: 9px; padding: 0.55rem 1rem;
    cursor: pointer; border: 1px solid var(--panel-border); background: var(--panel); color: var(--text);
  }
  button.action.primary { background: var(--accent); color: #241d44; border: none; font-weight: bold; }
  button.action.good { background: var(--good); color: #0d2a1a; border: none; font-weight: bold; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }

  /* modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none;
    align-items: center; justify-content: center; z-index: 150; padding: 1rem;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px;
    padding: 1.2rem; max-width: 380px; width: 100%; text-align: left;
    box-shadow: 0 20px 50px var(--shadow); animation: pop 0.2s ease;
  }
  @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h3 { margin: 0 0 0.3rem; }
  .modal .big { font-size: 2.5rem; text-align: center; margin: 0.3rem 0; }
  .modal p { color: var(--muted); font-size: 0.9rem; margin: 0.4rem 0; }
  .shop-item {
    display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem; border-radius: 10px;
    background: var(--panel-2); margin-bottom: 0.5rem;
  }
  .shop-item .ic { font-size: 1.6rem; }
  .shop-item .info { flex: 1; }
  .shop-item .info b { font-size: 0.95rem; }
  .shop-item .info small { display: block; color: var(--muted); font-size: 0.75rem; }
  .close-x { float: right; cursor: pointer; color: var(--muted); font-size: 1.3rem; line-height: 1; }

  .request-card {
    background: var(--panel-2); border-radius: 10px; padding: 0.8rem; margin: 0.5rem 0;
    border-left: 4px solid var(--accent);
  }

  .toast {
    position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--panel-border); color: var(--text);
    padding: 0.6rem 1.1rem; border-radius: 999px; box-shadow: 0 6px 18px var(--shadow);
    font-size: 0.88rem; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  .pop {
    position: fixed; pointer-events: none; font-weight: bold; color: var(--coin);
    font-size: 1.1rem; animation: popUp 0.9s ease forwards; z-index: 190; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  @keyframes popUp { 0%{opacity:0;transform:translateY(0) scale(0.6);} 20%{opacity:1;transform:translateY(-6px) scale(1.1);} 100%{opacity:0;transform:translateY(-36px) scale(1);} }

  footer { color: var(--muted); font-size: 0.75rem; margin-top: 1.4rem; }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle light/dark">🌙</button>

<div class="wrap">
  <h1>🏢 Rent Manager</h1>
  <p class="sub">Furnish units · house tenants · collect rent · grow your empire</p>

  <div class="hud">
    <div class="chip" id="coinChip">🪙 <span id="coins">0</span></div>
    <div class="chip" id="styleChip">✨ <span id="style">0</span> style</div>
    <div class="chip" id="lvlChip">⭐ Lv <span id="level">1</span></div>
    <div class="chip">📅 Day <span id="day">1</span></div>
  </div>

  <div class="building" id="building"></div>

  <div class="btn-row">
    <button class="action good" onclick="collectAll()">💰 Collect All Rent</button>
    <button class="action primary" id="buyFloorBtn" onclick="buyFloor()">🏗️ Add Floor</button>
    <button class="action" onclick="openRequests()">📋 Requests <span id="reqCount"></span></button>
    <button class="action" onclick="resetGame()">🔄 Reset</button>
  </div>

  <footer>
    Click an empty unit to furnish it → a tenant moves in → tap the 💰 bubble to collect rent.<br>
    Nicer units earn more. Fulfil tenant requests for bonus coins & style. Everything auto-saves.
  </footer>
</div>

<!-- Unit modal -->
<div class="overlay" id="unitOverlay" onclick="if(event.target===this)closeModal('unitOverlay')">
  <div class="modal" id="unitModal"></div>
</div>
<!-- Requests modal -->
<div class="overlay" id="reqOverlay" onclick="if(event.target===this)closeModal('reqOverlay')">
  <div class="modal" id="reqModal"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ---------- Config ---------- */
  const UNITS_PER_FLOOR = 3;
  const START_FLOORS = 1;
  const MAX_FLOORS = 8;

  // Furniture tiers: each level adds style + rent, costs more.
  const FURNISH = [
    { lvl: 1, name: "Basic",   cost: 40,   deco: "🛏️",        style: 2,  rent: 6,  interval: 10000 },
    { lvl: 2, name: "Comfy",   cost: 120,  deco: "🛏️🛋️",      style: 5,  rent: 16, interval: 10000 },
    { lvl: 3, name: "Stylish", cost: 320,  deco: "🛋️🪴🖼️",    style: 10, rent: 40, interval: 10000 },
    { lvl: 4, name: "Luxury",  cost: 800,  deco: "🛋️🪴🖼️🪟",  style: 18, rent: 95, interval: 10000 },
    { lvl: 5, name: "Deluxe",  cost: 2000, deco: "👑🛋️🪴🖼️🪟", style: 32, rent: 220,interval: 10000 },
  ];

  const TENANTS = ["🧑","👩","👨","🧓","👵","🧔","👩‍🦰","👨‍🦱","🧕","👩‍🦳","🤵","👩‍🎤"];

  const REQUESTS = [
    { text: "Could you upgrade my place? I'd love something nicer!", need: "upgrade", reward: 60, style: 5 },
    { text: "I've been a great tenant — any chance of a little gift? 🎁", need: "coins", cost: 30, reward: 90, style: 3 },
    { text: "A plant would really brighten my unit! 🪴", need: "coins", cost: 20, reward: 70, style: 6 },
    { text: "I'd stay longer if the building had more style overall ✨", need: "style", threshold: 30, reward: 120, style: 0 },
    { text: "Mind collecting my rent on time? I like a tidy landlord 💰", need: "collect", reward: 50, style: 2 },
  ];

  /* ---------- State ---------- */
  let state = {
    coins: 60, xp: 0, day: 1, style: 0,
    floors: START_FLOORS,
    units: [],      // { furnished:0|lvl, tenant, lastPaid, pending (accrued), request:null }
    selectedUnit: -1,
  };

  function levelFromXP(x){ return Math.floor(Math.sqrt(x/40))+1; }
  function xpForLevel(l){ return Math.pow(l-1,2)*40; }
  function floorCost(){ return Math.floor(300 * Math.pow(1.9, state.floors - START_FLOORS)); }
  function totalUnits(){ return state.floors * UNITS_PER_FLOOR; }

  /* ---------- Save / Load ---------- */
  function save(){ localStorage.setItem('rm_save', JSON.stringify(state)); }
  function load(){
    try { const s = JSON.parse(localStorage.getItem('rm_save')); if (s) state = Object.assign(state, s); } catch(e){}
    const want = totalUnits();
    if (!Array.isArray(state.units)) state.units = [];
    while (state.units.length < want) state.units.push(newUnit());
    state.units.length = want;
  }
  function newUnit(){ return { furnished: 0, tenant: null, pending: 0, lastTick: Date.now(), request: null }; }

  /* ---------- Rent accrual (based on real time) ---------- */
  function accrue(){
    const now = Date.now();
    for (const u of state.units) {
      if (u.furnished > 0 && u.tenant) {
        const f = FURNISH[u.furnished - 1];
        const elapsed = now - (u.lastTick || now);
        const periods = Math.floor(elapsed / f.interval);
        if (periods > 0) {
          // cap accrual so it doesn't explode after long absence
          const capped = Math.min(periods, 20);
          u.pending = Math.min((u.pending || 0) + capped * f.rent, f.rent * 20);
          u.lastTick = (u.lastTick || now) + periods * f.interval;
        }
        if (!u.lastTick) u.lastTick = now;
      }
    }
  }

  /* ---------- Rendering ---------- */
  function recomputeStyle(){
    state.style = state.units.reduce((s,u)=> s + (u.furnished>0 ? FURNISH[u.furnished-1].style : 0), 0);
  }

  function renderHUD(){
    document.getElementById('coins').textContent = Math.floor(state.coins);
    document.getElementById('style').textContent = state.style;
    document.getElementById('level').textContent = levelFromXP(state.xp);
    document.getElementById('day').textContent = state.day;
    const bf = document.getElementById('buyFloorBtn');
    bf.textContent = state.floors >= MAX_FLOORS ? "🏗️ Max floors" : `🏗️ Add Floor (🪙${floorCost()})`;
    bf.disabled = state.floors >= MAX_FLOORS || state.coins < floorCost();
    const pending = state.units.filter(u=>u.request).length;
    document.getElementById('reqCount').textContent = pending ? `(${pending})` : '';
  }

  function renderBuilding(){
    const b = document.getElementById('building');
    b.innerHTML = '<div class="roof"></div>';
    for (let f = state.floors - 1; f >= 0; f--) {
      const floor = document.createElement('div');
      floor.className = 'floor';
      const label = document.createElement('div');
      label.className = 'floor-label';
      label.textContent = `Floor ${f+1}`;
      const units = document.createElement('div');
      units.className = 'units';
      for (let i = 0; i < UNITS_PER_FLOOR; i++) {
        const idx = f * UNITS_PER_FLOOR + i;
        units.appendChild(renderUnit(idx));
      }
      floor.appendChild(label);
      floor.appendChild(units);
      b.appendChild(floor);
    }
  }

  function renderUnit(idx){
    const u = state.units[idx];
    const el = document.createElement('div');
    el.className = 'unit';
    el.dataset.i = idx;
    if (!u || u.furnished === 0) {
      el.innerHTML = `<div class="tenant">🚪</div><div class="label">Empty — furnish</div>`;
      el.onclick = () => openUnit(idx);
      return el;
    }
    const f = FURNISH[u.furnished - 1];
    el.classList.add('furnished');
    if (u.tenant) el.classList.add('occupied');
    if (u.request) el.classList.add('request');
    const stars = '★'.repeat(u.furnished) + '☆'.repeat(FURNISH.length - u.furnished);
    el.innerHTML = `
      ${u.pending > 0 ? `<div class="rent-bubble">🪙${u.pending}</div>` : ''}
      <div class="tenant">${u.tenant || '🪑'}</div>
      <div class="deco">${f.deco}</div>
      <div class="stars">${stars}</div>`;
    el.onclick = (e) => {
      if (u.pending > 0 && u.tenant) { collectUnit(idx, e); }
      else openUnit(idx);
    };
    return el;
  }

  function renderAll(){ accrue(); recomputeStyle(); renderHUD(); renderBuilding(); }

  /* ---------- Unit actions ---------- */
  function openUnit(idx){
    const u = state.units[idx];
    const m = document.getElementById('unitModal');
    const cur = u.furnished;
    const next = FURNISH[cur]; // undefined if maxed
    const curF = cur > 0 ? FURNISH[cur-1] : null;

    let html = `<span class="close-x" onclick="closeModal('unitOverlay')">✕</span>
      <h3>Unit #${idx+1}</h3>`;

    if (cur === 0) {
      html += `<p>This unit is empty. Furnish it to attract a tenant who'll pay rent.</p>`;
    } else {
      html += `<div class="big">${u.tenant || '🪑'} ${curF.deco}</div>
        <p><b>${curF.name}</b> · ✨${curF.style} style · 🪙${curF.rent} rent / cycle</p>`;
      if (u.tenant) html += `<p>Tenant mood: ${moodFor(idx)}</p>`;
    }

    if (next) {
      const canAfford = state.coins >= next.cost;
      html += `<div class="shop-item">
        <div class="ic">${next.deco}</div>
        <div class="info"><b>${cur===0?'Furnish':'Upgrade to'} ${next.name}</b>
          <small>✨${next.style} style · 🪙${next.rent} rent/cycle</small></div>
        <button class="action primary" ${canAfford?'':'disabled'} onclick="furnish(${idx})">🪙${next.cost}</button>
      </div>`;
    } else {
      html += `<p>✨ This unit is maxed out — Deluxe living!</p>`;
    }
    m.innerHTML = html;
    document.getElementById('unitOverlay').classList.add('show');
  }

  function furnish(idx){
    const u = state.units[idx];
    const next = FURNISH[u.furnished];
    if (!next || state.coins < next.cost) return;
    state.coins -= next.cost;
    const firstTime = u.furnished === 0;
    u.furnished++;
    if (firstTime) {
      u.tenant = TENANTS[Math.floor(Math.random()*TENANTS.length)];
      u.lastTick = Date.now();
      u.pending = 0;
      toast(`${u.tenant} moved into Unit #${idx+1}! 🎉`);
      maybeAssignRequest(idx);
    } else {
      toast(`Unit #${idx+1} upgraded to ${next.name}! ✨`);
      // upgrading can satisfy an "upgrade" request
      if (u.request && u.request.need === 'upgrade') fulfilRequest(idx);
    }
    state.xp += next.style;
    closeModal('unitOverlay');
    bump('coinChip'); bump('styleChip');
    renderAll(); save();
  }

  function collectUnit(idx, e){
    const u = state.units[idx];
    if (!u.pending) return;
    const amt = u.pending;
    state.coins += amt; u.pending = 0;
    coinPop(e, '+' + amt);
    bump('coinChip');
    // collecting satisfies a "collect" request
    if (u.request && u.request.need === 'collect') fulfilRequest(idx);
    renderAll(); save();
  }

  function collectAll(){
    let total = 0;
    state.units.forEach((u,idx) => {
      if (u.pending > 0) {
        total += u.pending; u.pending = 0;
        if (u.request && u.request.need === 'collect') fulfilRequest(idx, true);
      }
    });
    if (total > 0) {
      state.coins += total;
      toast(`💰 Collected 🪙${total} in rent!`);
      bump('coinChip');
    } else toast("No rent waiting right now.");
    renderAll(); save();
  }

  function buyFloor(){
    if (state.floors >= MAX_FLOORS) return;
    const cost = floorCost();
    if (state.coins < cost) { toast("Not enough coins for a new floor."); return; }
    state.coins -= cost;
    state.floors++;
    for (let i=0;i<UNITS_PER_FLOOR;i++) state.units.push(newUnit());
    toast(`🏗️ Floor ${state.floors} added — ${UNITS_PER_FLOOR} new units!`);
    bump('coinChip');
    renderAll(); save();
  }

  function moodFor(idx){
    const u = state.units[idx];
    if (u.request) return "😐 has a request";
    const lvl = u.furnished;
    return lvl >= 4 ? "😄 delighted" : lvl >= 2 ? "🙂 content" : "😊 okay";
  }

  /* ---------- Requests / Quests ---------- */
  function maybeAssignRequest(idx){
    // ~45% chance a newly-housed tenant has a request
    if (Math.random() < 0.45) {
      const base = REQUESTS[Math.floor(Math.random()*REQUESTS.length)];
      state.units[idx].request = Object.assign({}, base);
    }
  }
  // periodically give existing tenants requests too
  function sprinkleRequests(){
    for (let idx=0; idx<state.units.length; idx++){
      const u = state.units[idx];
      if (u.tenant && !u.request && Math.random() < 0.04) {
        const base = REQUESTS[Math.floor(Math.random()*REQUESTS.length)];
        u.request = Object.assign({}, base);
      }
    }
  }

  function openRequests(){
    const m = document.getElementById('reqModal');
    const pending = state.units.map((u,i)=>({u,i})).filter(x=>x.u.request);
    let html = `<span class="close-x" onclick="closeModal('reqOverlay')">✕</span><h3>📋 Tenant Requests</h3>`;
    if (pending.length === 0) {
      html += `<p>No requests right now. Happy tenants! 😊</p>`;
    } else {
      for (const {u,i} of pending) {
        const r = u.request;
        let btn = '';
        if (r.need === 'upgrade') {
          const canUp = u.furnished < FURNISH.length;
          btn = `<button class="action primary" onclick="closeModal('reqOverlay');openUnit(${i})" ${canUp?'':'disabled'}>Upgrade unit</button>`;
        } else if (r.need === 'coins') {
          const can = state.coins >= r.cost;
          btn = `<button class="action primary" ${can?'':'disabled'} onclick="spendOnRequest(${i})">Give gift (🪙${r.cost})</button>`;
        } else if (r.need === 'style') {
          const can = state.style >= r.threshold;
          btn = `<button class="action primary" ${can?'':'disabled'} onclick="fulfilRequest(${i});refreshReq()">${can?'Claim reward':`Need ✨${r.threshold} style`}</button>`;
        } else if (r.need === 'collect') {
          btn = `<small>Collect this unit's rent to fulfil (reward 🪙${r.reward})</small>`;
        }
        html += `<div class="request-card">
          <b>${u.tenant} Unit #${i+1}</b>
          <p>"${r.text}"</p>
          <small>Reward: 🪙${r.reward}${r.style?` · ✨${r.style}`:''}</small><br>${btn}
        </div>`;
      }
    }
    m.innerHTML = html;
    document.getElementById('reqOverlay').classList.add('show');
  }
  function refreshReq(){ if (document.getElementById('reqOverlay').classList.contains('show')) openRequests(); }

  function spendOnRequest(idx){
    const u = state.units[idx];
    if (!u.request || state.coins < (u.request.cost||0)) return;
    state.coins -= u.request.cost;
    fulfilRequest(idx);
    refreshReq();
  }

  function fulfilRequest(idx, silent){
    const u = state.units[idx];
    if (!u.request) return;
    const r = u.request;
    state.coins += r.reward || 0;
    state.xp += (r.style || 0) + 5;
    u.request = null;
    if (!silent) toast(`✅ ${u.tenant} is happy! +🪙${r.reward}${r.style?` +✨${r.style}`:''}`);
    bump('coinChip');
    renderAll(); save();
  }

  /* ---------- Effects ---------- */
  let toastTimer;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 2000);
  }
  function coinPop(e, text){
    const p = document.createElement('div');
    p.className = 'pop'; p.textContent = '🪙 ' + text;
    const x = e && e.clientX ? e.clientX : window.innerWidth/2;
    const y = e && e.clientY ? e.clientY : window.innerHeight/2;
    p.style.left = (x-10)+'px'; p.style.top = (y-10)+'px';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 900);
  }
  function bump(id){ const el=document.getElementById(id); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  function closeModal(id){ document.getElementById(id).classList.remove('show'); }

  /* ---------- Theme ---------- */
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('themeToggle').textContent = t === 'light' ? '☀️' : '🌙';
    localStorage.setItem('rm_theme', t);
  }
  function toggleTheme(){
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  }

  function resetGame(){
    if (!confirm("Sell the whole building and start over? This can't be undone.")) return;
    localStorage.removeItem('rm_save');
    state = { coins: 60, xp: 0, day: 1, style: 0, floors: START_FLOORS, units: [], selectedUnit: -1 };
    for (let i=0;i<totalUnits();i++) state.units.push(newUnit());
    renderAll(); save();
  }

  /* ---------- Loop ---------- */
  let tickCount = 0;
  function tick(){
    tickCount++;
    accrue();
    if (tickCount % 15 === 0) { sprinkleRequests(); state.day++; }
    renderAll();
    if (tickCount % 10 === 0) save();
  }

  /* ---------- Init ---------- */
  applyTheme(localStorage.getItem('rm_theme') || 'dark');
  load();
  renderAll();
  setInterval(tick, 2000);
</script>
</body>
</html>
