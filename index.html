<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pocket Farm 🌱</title>
<style>
  :root, [data-theme="dark"] {
    --bg: #16241a;
    --bg2: #24402c;
    --panel: #1e3326;
    --panel-border: #335c40;
    --plot-empty: #4a3528;
    --plot-tilled: #5c4231;
    --plot-ready: #6b8f3e;
    --text: #eaf7ec;
    --muted: #9ec4a6;
    --accent: #ffd24d;
    --coin: #ffd24d;
    --good: #7be07b;
    --shadow: rgba(0,0,0,0.4);
  }
  [data-theme="light"] {
    --bg: #eaf7ec;
    --bg2: #d4efd8;
    --panel: #ffffff;
    --panel-border: #c3e3c9;
    --plot-empty: #c9a884;
    --plot-tilled: #a9825f;
    --plot-ready: #a8d66a;
    --text: #1e3326;
    --muted: #5a7a62;
    --accent: #e0a200;
    --coin: #d99e00;
    --good: #2e9d4e;
    --shadow: rgba(100,130,100,0.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg2) 0%, var(--bg) 70%);
    color: var(--text);
    min-height: 100vh;
    padding: 1.2rem 1rem 3rem;
    text-align: center;
    transition: background 0.4s ease, color 0.4s ease;
  }
  .wrap { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 2rem; margin: 0.2rem 0 0; }
  .sub { color: var(--muted); margin: 0.2rem 0 1rem; }

  .theme-toggle {
    position: fixed; top: 1rem; right: 1rem; z-index: 100;
    background: var(--panel); border: 1px solid var(--panel-border);
    color: var(--text); border-radius: 999px; padding: 0.5rem 0.9rem;
    font-size: 1.3rem; cursor: pointer; box-shadow: 0 4px 14px var(--shadow);
  }

  /* top bar */
  .hud {
    display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center;
    margin-bottom: 1rem;
  }
  .hud .chip {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 999px; padding: 0.45rem 1rem; font-weight: bold;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .chip.bump { animation: bump 0.3s ease; }
  @keyframes bump { 0%,100%{transform:scale(1);} 50%{transform:scale(1.15);} }
  .xp-track { flex-basis: 100%; max-width: 420px; margin: 0 auto; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 999px; height: 10px; overflow: hidden; }
  .xp-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--good), var(--accent)); transition: width 0.4s ease; }

  /* seed picker */
  .seeds { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 1rem; }
  .seed {
    background: var(--panel); border: 2px solid var(--panel-border);
    border-radius: 12px; padding: 0.5rem 0.7rem; cursor: pointer; min-width: 92px;
    transition: transform 0.1s ease, border-color 0.2s ease;
  }
  .seed:hover { transform: translateY(-2px); }
  .seed.selected { border-color: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .seed.locked { opacity: 0.55; }
  .seed .emoji { font-size: 1.6rem; }
  .seed .name { font-size: 0.85rem; font-weight: bold; }
  .seed .meta { font-size: 0.72rem; color: var(--muted); }

  /* farm grid */
  .farm {
    display: grid; gap: 10px; justify-content: center; margin: 0 auto 1rem;
    grid-template-columns: repeat(var(--cols, 4), 64px);
  }
  .plot {
    width: 64px; height: 64px; border-radius: 12px;
    background: var(--plot-empty);
    border: 2px solid rgba(0,0,0,0.15);
    cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.9rem; overflow: hidden;
    transition: background 0.3s ease, transform 0.1s ease;
    box-shadow: inset 0 -4px 8px rgba(0,0,0,0.2);
  }
  .plot.locked { background: transparent; border: 2px dashed var(--panel-border); cursor: pointer; font-size: 1rem; color: var(--muted); }
  .plot.growing { background: var(--plot-tilled); }
  .plot.ready { background: var(--plot-ready); animation: wiggle 1.4s ease-in-out infinite; }
  @keyframes wiggle { 0%,100%{transform:rotate(0);} 25%{transform:rotate(-4deg);} 75%{transform:rotate(4deg);} }
  .plot:active { transform: scale(0.94); }
  /* growth ring */
  .ring {
    position: absolute; bottom: 3px; left: 6px; right: 6px; height: 5px;
    background: rgba(0,0,0,0.25); border-radius: 999px; overflow: hidden;
  }
  .ring > i { display: block; height: 100%; background: var(--good); width: 0%; }

  /* coin pop */
  .pop {
    position: absolute; pointer-events: none; font-weight: bold; color: var(--coin);
    font-size: 1.1rem; animation: popUp 0.9s ease forwards; z-index: 50; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  @keyframes popUp { 0%{opacity:0;transform:translateY(0) scale(0.6);} 20%{opacity:1;transform:translateY(-6px) scale(1.1);} 100%{opacity:0;transform:translateY(-34px) scale(1);} }

  .btn-row { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-top: 0.5rem; }
  button.action {
    font-family: inherit; font-size: 0.9rem; border-radius: 8px; padding: 0.5rem 1rem;
    cursor: pointer; border: 1px solid var(--panel-border); background: var(--panel); color: var(--text);
  }
  button.action.primary { background: var(--accent); color: #1e3326; border: none; font-weight: bold; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }

  .toast {
    position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--panel-border); color: var(--text);
    padding: 0.6rem 1.1rem; border-radius: 999px; box-shadow: 0 6px 18px var(--shadow);
    font-size: 0.9rem; opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease; pointer-events: none; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  footer { color: var(--muted); font-size: 0.78rem; margin-top: 1.5rem; }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle light/dark">🌙</button>

<div class="wrap">
  <h1>🌱 Pocket Farm</h1>
  <p class="sub">Plant · wait · harvest · grow your little farm</p>

  <div class="hud">
    <div class="chip" id="coinChip">🪙 <span id="coins">0</span></div>
    <div class="chip" id="lvlChip">⭐ Lv <span id="level">1</span></div>
    <div class="chip">📅 Day <span id="day">1</span></div>
    <div class="xp-track"><div class="xp-bar" id="xpBar"></div></div>
  </div>

  <div class="seeds" id="seeds"></div>

  <div class="farm" id="farm"></div>

  <div class="btn-row">
    <button class="action primary" id="buyPlotBtn" onclick="buyPlot()">🧺 Buy Plot</button>
    <button class="action" onclick="harvestAll()">🌾 Harvest All Ready</button>
    <button class="action" onclick="resetGame()">🔄 Reset Farm</button>
  </div>

  <footer>Tip: pick a seed, click an empty plot to plant. Crops keep growing even while you're away. 🌾<br>Your farm auto-saves in this browser.</footer>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ---------- Crop definitions ---------- */
  // growMs = total grow time; stages shown as emoji progression
  const CROPS = {
    carrot:     { name: "Carrot",     seedCost: 5,   sell: 12,  growMs: 8000,   xp: 3,  unlockLvl: 1, ready: "🥕", stages: ["🌱","🌿","🥕"] },
    corn:       { name: "Corn",       seedCost: 12,  sell: 30,  growMs: 18000,  xp: 6,  unlockLvl: 2, ready: "🌽", stages: ["🌱","🌿","🌽"] },
    strawberry: { name: "Strawberry", seedCost: 25,  sell: 65,  growMs: 32000,  xp: 11, unlockLvl: 3, ready: "🍓", stages: ["🌱","🌿","🍓"] },
    pumpkin:    { name: "Pumpkin",    seedCost: 60,  sell: 170, growMs: 60000,  xp: 25, unlockLvl: 5, ready: "🎃", stages: ["🌱","🌿","🎃"] },
    melon:      { name: "Melon",      seedCost: 120, sell: 360, growMs: 95000,  xp: 50, unlockLvl: 7, ready: "🍉", stages: ["🌱","🌿","🍉"] },
  };
  const CROP_ORDER = ["carrot","corn","strawberry","pumpkin","melon"];

  /* ---------- State ---------- */
  let state = {
    coins: 20,
    xp: 0,
    day: 1,
    plots: 4,            // unlocked plot count
    selected: "carrot",
    farm: [],            // each: null | { crop, plantedAt }
    maxPlots: 16,
  };

  const farmEl = document.getElementById('farm');
  const seedsEl = document.getElementById('seeds');

  function levelFromXP(xp) { return Math.floor(Math.sqrt(xp / 20)) + 1; }
  function xpForLevel(l) { return Math.pow(l - 1, 2) * 20; }
  function plotCost() { return Math.floor(40 * Math.pow(1.6, state.plots - 4)); }

  /* ---------- Save / Load ---------- */
  function save() { localStorage.setItem('pf_save', JSON.stringify(state)); }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem('pf_save'));
      if (s && typeof s === 'object') state = Object.assign(state, s);
    } catch (e) {}
    if (!Array.isArray(state.farm) || state.farm.length !== state.plots) {
      // normalize farm array length to plots
      const f = state.farm || [];
      state.farm = Array.from({ length: state.plots }, (_, i) => f[i] || null);
    }
  }

  /* ---------- Rendering ---------- */
  function renderHUD() {
    document.getElementById('coins').textContent = Math.floor(state.coins);
    const lv = levelFromXP(state.xp);
    document.getElementById('level').textContent = lv;
    document.getElementById('day').textContent = state.day;
    const base = xpForLevel(lv), next = xpForLevel(lv + 1);
    document.getElementById('xpBar').style.width = Math.min(100, ((state.xp - base) / (next - base)) * 100) + '%';
    document.getElementById('buyPlotBtn').textContent = state.plots >= state.maxPlots
      ? "🧺 Max plots" : `🧺 Buy Plot (🪙${plotCost()})`;
    document.getElementById('buyPlotBtn').disabled = state.plots >= state.maxPlots || state.coins < plotCost();
  }

  function renderSeeds() {
    const lv = levelFromXP(state.xp);
    seedsEl.innerHTML = '';
    for (const key of CROP_ORDER) {
      const c = CROPS[key];
      const unlocked = lv >= c.unlockLvl;
      const div = document.createElement('div');
      div.className = 'seed' + (state.selected === key ? ' selected' : '') + (unlocked ? '' : ' locked');
      div.innerHTML = `
        <div class="emoji">${unlocked ? c.ready : '🔒'}</div>
        <div class="name">${c.name}</div>
        <div class="meta">${unlocked ? `🪙${c.seedCost} → 🪙${c.sell}` : `Unlock Lv ${c.unlockLvl}`}</div>`;
      if (unlocked) div.onclick = () => { state.selected = key; renderSeeds(); };
      seedsEl.appendChild(div);
    }
  }

  function renderFarm() {
    farmEl.style.setProperty('--cols', Math.min(state.plots, 8));
    farmEl.innerHTML = '';
    for (let i = 0; i < state.plots; i++) {
      const plot = document.createElement('div');
      plot.className = 'plot';
      plot.dataset.i = i;
      const data = state.farm[i];
      if (!data) {
        plot.textContent = '';
        plot.onclick = (e) => plant(i, e);
      } else {
        const c = CROPS[data.crop];
        const elapsed = Date.now() - data.plantedAt;
        const pct = Math.min(1, elapsed / c.growMs);
        const isReady = pct >= 1;
        const stageIdx = isReady ? 2 : (pct > 0.45 ? 1 : 0);
        plot.textContent = c.stages[stageIdx];
        plot.classList.add(isReady ? 'ready' : 'growing');
        if (!isReady) {
          const ring = document.createElement('div');
          ring.className = 'ring';
          ring.innerHTML = `<i style="width:${(pct * 100).toFixed(0)}%"></i>`;
          plot.appendChild(ring);
        }
        plot.onclick = (e) => { if (isReady) harvest(i, e); else toast(`Still growing… ${Math.ceil((c.growMs - elapsed) / 1000)}s left`); };
      }
      farmEl.appendChild(plot);
    }
  }

  function renderAll() { renderHUD(); renderSeeds(); renderFarm(); }

  /* ---------- Actions ---------- */
  function plant(i, e) {
    const key = state.selected;
    const c = CROPS[key];
    const lv = levelFromXP(state.xp);
    if (lv < c.unlockLvl) { toast(`${c.name} unlocks at Lv ${c.unlockLvl}`); return; }
    if (state.coins < c.seedCost) { toast(`Not enough coins for ${c.name} seeds`); return; }
    state.coins -= c.seedCost;
    state.farm[i] = { crop: key, plantedAt: Date.now() };
    bump('coinChip');
    renderAll(); save();
  }

  function harvest(i, e) {
    const data = state.farm[i];
    if (!data) return;
    const c = CROPS[data.crop];
    if (Date.now() - data.plantedAt < c.growMs) return;
    state.coins += c.sell;
    const prevLv = levelFromXP(state.xp);
    state.xp += c.xp;
    const newLv = levelFromXP(state.xp);
    state.farm[i] = null;
    coinPop(e, `+${c.sell}`);
    bump('coinChip');
    if (newLv > prevLv) { toast(`⭐ Level up! You're now Lv ${newLv}`); bump('lvlChip'); state.day++; }
    renderAll(); save();
  }

  function harvestAll() {
    let got = 0;
    for (let i = 0; i < state.plots; i++) {
      const data = state.farm[i];
      if (data && Date.now() - data.plantedAt >= CROPS[data.crop].growMs) {
        const c = CROPS[data.crop];
        state.coins += c.sell; state.xp += c.xp; got += c.sell;
        state.farm[i] = null;
      }
    }
    if (got > 0) { toast(`🌾 Harvested everything for 🪙${got}!`); bump('coinChip'); }
    else toast("Nothing ready to harvest yet.");
    renderAll(); save();
  }

  function buyPlot() {
    if (state.plots >= state.maxPlots) return;
    const cost = plotCost();
    if (state.coins < cost) { toast("Not enough coins for a new plot."); return; }
    state.coins -= cost;
    state.plots++;
    state.farm.push(null);
    toast("🧺 New plot added!");
    renderAll(); save();
  }

  function resetGame() {
    if (!confirm("Plow it all under and start a fresh farm? This can't be undone.")) return;
    localStorage.removeItem('pf_save');
    state = { coins: 20, xp: 0, day: 1, plots: 4, selected: "carrot", farm: Array(4).fill(null), maxPlots: 16 };
    renderAll(); save();
  }

  /* ---------- Effects ---------- */
  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }
  function coinPop(e, text) {
    const pop = document.createElement('div');
    pop.className = 'pop'; pop.textContent = '🪙 ' + text;
    pop.style.left = (e.clientX - 10) + 'px';
    pop.style.top = (e.clientY - 10) + 'px';
    pop.style.position = 'fixed';
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 900);
  }
  function bump(id) {
    const el = document.getElementById(id);
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  }

  /* ---------- Theme ---------- */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('themeToggle').textContent = t === 'light' ? '☀️' : '🌙';
    localStorage.setItem('pf_theme', t);
  }
  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  }

  /* ---------- Game loop ---------- */
  function tick() {
    // only re-render farm (cheap) to update rings / ready states
    renderFarm();
    renderHUD();
  }

  /* ---------- Init ---------- */
  applyTheme(localStorage.getItem('pf_theme') || 'dark');
  load();
  renderAll();
  setInterval(tick, 1000);
</script>
</body>
</html>
